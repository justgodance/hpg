<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_artur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="helm_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg_artur)"/>
  <circle cx="100" cy="100" r="76" fill="#1e1e2f" stroke="url(#helm_gold)" stroke-width="4"/>
  <!-- Knight Helm / Crown -->
  <g fill="url(#helm_gold)">
    <!-- Crown / Crest -->
    <polygon points="76,64 88,48 100,58 112,48 124,64 100,72" />
    <!-- Helmet Dome -->
    <path d="M72,80 C72,60 128,60 128,80 L128,110 C128,135 100,150 100,150 C100,150 72,135 72,110 Z" fill="#2d3748" stroke="url(#helm_gold)" stroke-width="3"/>
    <!-- Visor slits -->
    <line x1="82" y1="96" x2="118" y2="96" stroke="#fef08a" stroke-width="4" stroke-linecap="round"/>
    <line x1="88" y1="106" x2="112" y2="106" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
    <line x1="92" y1="116" x2="108" y2="116" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="100" y="176" text-anchor="middle" font-family="Cinzel, serif" font-weight="900" font-size="11" fill="#fef08a" letter-spacing="2">КАПИТАН</text>
</svg>
