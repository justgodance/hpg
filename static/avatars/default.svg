<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1e0f"/>
      <stop offset="50%" stop-color="#220f06"/>
      <stop offset="100%" stop-color="#120703"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#gold)" stroke-width="4" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="100" cy="100" r="72" fill="#180b05" stroke="#b45309" stroke-width="3"/>
  <!-- Witcher Wolf Medallion Silhouette -->
  <g fill="url(#gold)" filter="url(#glow)">
    <!-- Ears -->
    <polygon points="68,52 82,78 64,80" />
    <polygon points="132,52 118,78 136,80" />
    <!-- Forehead -->
    <polygon points="82,78 100,64 118,78 100,92" />
    <!-- Cheeks & Eyes -->
    <polygon points="64,80 82,78 92,94 68,102" />
    <polygon points="136,80 118,78 108,94 132,102" />
    <!-- Eyes glow -->
    <circle cx="86" cy="88" r="3.5" fill="#ef4444"/>
    <circle cx="114" cy="88" r="3.5" fill="#ef4444"/>
    <!-- Snout & Fangs -->
    <polygon points="92,94 108,94 100,128" />
    <polygon points="86,112 94,116 90,132" />
    <polygon points="114,112 106,116 110,132" />
    <polygon points="92,126 108,126 100,146" />
  </g>
  <text x="100" y="174" text-anchor="middle" font-family="Cinzel, serif" font-weight="900" font-size="12" fill="#fbbf24" letter-spacing="3">ИГРОК</text>
</svg>
