<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_vlad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#02150a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg_vlad)"/>
  <circle cx="100" cy="100" r="76" fill="#091f13" stroke="url(#emerald)" stroke-width="4"/>
  <!-- Hunter / Archer Bow & Swords -->
  <g fill="none" stroke="url(#emerald)" stroke-width="4" stroke-linecap="round">
    <!-- Crossed Silver Swords -->
    <line x1="60" y1="60" x2="140" y2="140" stroke-width="4"/>
    <line x1="140" y1="60" x2="60" y2="140" stroke-width="4"/>
    <!-- Pommels -->
    <circle cx="56" cy="56" r="5" fill="#86efac"/>
    <circle cx="144" cy="56" r="5" fill="#86efac"/>
    <!-- Guards -->
    <line x1="68" y1="80" x2="80" y2="68" stroke-width="5"/>
    <line x1="132" y1="80" x2="120" y2="68" stroke-width="5"/>
  </g>
  <!-- Center Shield Gem -->
  <polygon points="100,75 118,95 100,125 82,95" fill="url(#emerald)"/>
  <circle cx="100" cy="98" r="4" fill="#ffffff"/>
  <text x="100" y="176" text-anchor="middle" font-family="Cinzel, serif" font-weight="900" font-size="11" fill="#86efac" letter-spacing="2">ИГРОК</text>
</svg>
